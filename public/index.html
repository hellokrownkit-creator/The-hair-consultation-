<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d584a"><title>THE HAIR CONSULTATION™</title>
<style>
:root{--ink:#2b2622;--muted:#756d66;--paper:#fffdf9;--bg:#f3efe9;--line:#ded5cc;--accent:#6d584a;--soft:#eee7df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.brand{font:500 22px Georgia,serif;letter-spacing:.08em}.brand small{display:block;font:10px system-ui;letter-spacing:.18em;color:var(--muted);margin-top:4px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:8px 0 20px}.tabs{display:flex;gap:7px}.btn,.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;color:var(--ink);cursor:pointer}.primary,.tabs .active{background:var(--accent);color:#fff;border-color:var(--accent)}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px;margin:14px 0;box-shadow:0 5px 18px #2b26220b}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:34px;line-height:1.08;margin:4px 0 8px}h2{font-size:23px;margin:0 0 8px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}.banner{background:var(--soft);border:1px solid #dfd2c5;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices label{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}.bar{height:5px;background:#e3dbd3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.hidden{display:none!important}.small{font-size:11px;color:var(--muted)}.success{text-align:center;padding:35px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin:8px 0}.row small{color:var(--muted)}.copy{cursor:pointer}.danger{color:#8b3328}.linkbox{background:#f7f3ee;border:1px dashed #cfc3b8;padding:12px;border-radius:9px;word-break:break-all;font-size:12px}@media(max-width:680px){.wrap{padding:14px}.grid{grid-template-columns:1fr}header{display:block}.tabs{margin-top:12px;overflow:auto}.tabs button{white-space:nowrap}h1{font-size:29px}}
@media print{header,.tabs,.no-print,button{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style></head><body><div class="wrap">
<header><div><div class="brand">THE HAIR CONSULTATION™<small>PRIVATE PRE-APPOINTMENT EDITION</small></div></div><div class="tabs"><button id="tClient" class="active" onclick="show('client')">Client</button><button id="tSalon" onclick="show('salon')">Salon</button></div></header>
<section id="client"></section>
<section id="salon" class="hidden"></section>
</div>
<script>
const SERVICES=["Haircut / Styling","Colour / Lightening","Treatment / Repair","Texture / Smoothing"];
const ALL_STEPS=["details","goals","history","condition","scalp","notes","review"];
let client={step:0,fields:{},token:new URLSearchParams(location.search).get("token")||""};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const choices=(n,a,m=false)=>`<div class="choices">${a.map(x=>`<label><input type="${m?"checkbox":"radio"}" name="${n}" value="${esc(x)}"> ${esc(x)}</label>`).join("")}</div>`;
const inp=(n,l,t="text")=>`<div class="field"><label>${l}</label><input name="${n}" type="${t}"></div>`;
const area=(n,l)=>`<div class="field"><label>${l}</label><textarea name="${n}"></textarea></div>`;
function service(){return client.service||client.fields.service||"Colour / Lightening"}
function steps(){let s=["details","goals","condition","scalp","notes","review"];let x=service();if(x==="Colour / Lightening"||x==="Texture / Smoothing")s.splice(2,0,"history");return s}
function save(){document.querySelectorAll("#client [name]").forEach(e=>{if(e.type==="checkbox")client.fields[e.name]=[...document.querySelectorAll(`#client [name="${e.name}"]:checked`)].map(x=>x.value);else if(e.type==="radio"){if(e.checked)client.fields[e.name]=e.value}else client.fields[e.name]=e.value});client.service=client.fields.service||client.service}
function restore(){document.querySelectorAll("#client [name]").forEach(e=>{let v=client.fields[e.name];if(v==null)return;if(e.type==="checkbox")e.checked=Array.isArray(v)&&v.includes(e.value);else if(e.type==="radio")e.checked=v===e.value;else e.value=v})}
function renderClient(){
 if(!client.token){document.getElementById("client").innerHTML=`<div class="card"><div class="eyebrow">CLIENT LINK</div><h1>Your consultation link is missing.</h1><p class="muted">Please use the private consultation link sent by your salon.</p></div>`;return}
 const ss=steps(),k=ss[client.step]||"details";
 const content={
 details:`<div class="card"><div class="eyebrow">BEFORE YOUR APPOINTMENT</div><h1>Help your stylist understand your hair before you arrive.</h1><p class="muted">This short consultation helps the salon prepare for your appointment.</p><div class="grid">${inp("fullName","Full name")}${inp("preferredName","Preferred name")}${inp("mobile","Mobile")}${inp("email","Email","email")}</div><div class="field" style="margin-top:14px"><label>Booked service</label>${choices("service",SERVICES)}</div></div>`,
 goals:`<div class="card"><h2>Your Desired Result</h2><div class="grid">${area("desiredResult","What would you like to achieve?")}${area("inspiration","What do you love about your inspiration?")}${area("avoid","Anything you definitely want to avoid?")}${area("references","Reference images, links or notes")}</div></div>`,
 history:`<div class="card"><h2>Hair & Chemical History</h2><p class="muted">Please include anything that could affect your service, including home treatments.</p><div class="field"><label>In the last 24 months, have you had any of these?</label>${choices("chemHistory",["Colour","Bleach / Lightener","Highlights","Balayage","Toner / Gloss","Colour remover","Box dye","Henna","Metallic / unknown dye","Keratin","Perm / relaxer","Extensions"],true)}</div><div class="grid" style="margin-top:14px">${area("timeline","Approximate dates, brands, shades or details")}${area("otherTreatments","Anything else your stylist should know")}</div></div>`,
 condition:`<div class="card"><h2>Your Hair Today</h2><div class="field"><label>Hair pattern</label>${choices("pattern",["Straight","Wavy","Curly","Coily"])}</div><div class="field" style="margin-top:12px"><label>Hair thickness</label>${choices("thickness",["Fine","Medium","Thick","Coarse"])}</div><div class="field" style="margin-top:12px"><label>Current concerns</label>${choices("concerns",["Dryness","Breakage","Frizz","Tangles","Damage","Uneven colour","Fading","Scalp discomfort","None"],true)}</div><div class="grid" style="margin-top:14px">${area("homeCare","What products or treatments do you regularly use at home?")}${area("heatAndLifestyle","Heat styling, swimming, sun exposure or other relevant habits")}</div></div>`,
 scalp:`<div class="card"><h2>Scalp & Sensitivity</h2><div class="field"><label>Have you experienced any of these?</label>${choices("scalpFlags",["Sensitive scalp","Itching","Flaking","Redness","Irritation","Previous scalp reaction","Previous colour reaction","Previous bleach reaction","Known product allergy","None"],true)}</div><div class="grid" style="margin-top:14px">${area("allergies","Known allergies or sensitivities")}${area("scalpNotes","Anything else about your scalp or skin your stylist should know")}</div></div>`,
 notes:`<div class="card"><h2>Anything Else</h2>${area("additionalNotes","Anything you would like your stylist to know before your appointment")}</div>`,
 review:`<div class="card"><h2>Review & Submit</h2><div class="banner">Please check your answers. Your salon will receive this consultation after submission.</div><div id="review"></div><label class="choices" style="margin-top:15px"><span><input type="checkbox" id="confirm"> I confirm that the information I have provided is accurate to the best of my knowledge.</span></label></div>`
 }[k];
 document.getElementById("client").innerHTML=`<div class="bar"><i style="width:${(client.step+1)/ss.length*100}%"></i></div>${content}<div class="nav"><button class="btn" onclick="back()" ${client.step===0?"disabled":""}>← Back</button><span class="small">${client.step+1} of ${ss.length}</span><button class="btn primary" onclick="${k==="review"?"submitClient()":"next()"}">${k==="review"?"Submit Consultation":"Continue →"}</button></div>`;
 restore();if(k==="review")buildReview()
}
function next(){save();client.step++;renderClient();scrollTo(0,0)}
function back(){save();client.step--;renderClient();scrollTo(0,0)}
function buildReview(){let f=client.fields;document.getElementById("review").innerHTML=[["Name",f.fullName],["Service",f.service],["Desired result",f.desiredResult],["Chemical history",(f.chemHistory||[]).join(", ")||"None selected"],["Current concerns",(f.concerns||[]).join(", ")||"None selected"]].map(x=>`<div class="row"><div><b>${esc(x[0])}</b><br><small>${esc(x[1]||"Not provided")}</small></div></div>`).join("")}
async function submitClient(){save();if(!client.fields.fullName||!client.fields.service)return alert("Please provide your name and booked service.");if(!document.getElementById("confirm").checked)return alert("Please confirm your information before submitting.");let r=await fetch("/api/client/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:client.token,client:{fullName:client.fields.fullName,preferredName:client.fields.preferredName,mobile:client.fields.mobile,email:client.fields.email},answers:client.fields})}),d=await r.json();if(!r.ok)return alert(d.error||"Unable to submit.");document.getElementById("client").innerHTML=`<div class="card success"><div style="font-size:30px">✓</div><h1>Consultation submitted</h1><p class="muted">Your salon has received your information and can review it before your appointment.</p></div>`}
async function loadClient(){let r=await fetch("/api/client/link?token="+encodeURIComponent(client.token)),d=await r.json();if(!r.ok)return renderClient();client.salon=d.salonName;client.service=d.service;renderClient()}
async function show(m){client.hidden=m==="salon";salon.hidden=m==="client";tClient.classList.toggle("active",m==="client");tSalon.classList.toggle("active",m==="salon");if(m==="salon")renderSalon()}
async function renderSalon(){
  const salonEl=document.getElementById("salon");
  salonEl.innerHTML=`<div class="card"><div class="eyebrow">SALON PORTAL</div><h1>Loading…</h1><p class="muted">Checking salon access.</p></div>`;
  try{
    const r=await fetch("/api/me",{credentials:"same-origin"});
    const me=await r.json();
    if(!r.ok) throw new Error(me.error||("Server returned "+r.status));
    if(!me.signedIn){
      salonEl.innerHTML=`<div class="card"><div class="eyebrow">SALON PORTAL</div><h1>Private consultation inbox</h1><p class="muted">Sign in to create client links and review submitted consultations.</p><div class="field"><label>Salon password</label><input id="pw" type="password" placeholder="Salon password"></div><div id="loginError"></div><button class="btn primary" style="margin-top:10px" onclick="login()">Sign in</button></div>`;
      return;
    }
    salonEl.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">${esc(me.salonName)}</div><h1>Consultation Inbox</h1></div><button class="btn" onclick="logout()">Sign out</button></div><div class="banner">Create a private one-use link for each client. Send the link before the appointment.</div><div class="grid"><div class="field"><label>Service</label><select id="newService">${SERVICES.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Client name (optional)</label><input id="newClient"></div></div><button class="btn primary" style="margin-top:12px" onclick="createLink()">Create Client Link</button><div id="newLink"></div></div><div class="card"><h2>Submitted consultations</h2><div id="inbox">Loading…</div></div>`;
    loadInbox();
  }catch(e){
    salonEl.innerHTML=`<div class="card"><div class="eyebrow">SALON PORTAL</div><h1>Salon area could not load</h1><div class="banner" style="border-color:#c99;background:#f7e5e2">${esc(e.message||"Unknown error")}</div><p class="muted">The page is working, but the salon API did not return a valid response. Tap Try again after the Render service finishes starting.</p><button class="btn primary" onclick="renderSalon()">Try again</button></div>`;
  }
}
async function login(){
  const passwordEl=document.getElementById("pw");
  const errorEl=document.getElementById("loginError");
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:passwordEl.value})});
    const d=await r.json();
    if(!r.ok){errorEl.innerHTML=`<div class="banner" style="border-color:#c99;background:#f7e5e2">${esc(d.error||"Sign in failed")}</div>`;return;}
    renderSalon();
  }catch(e){errorEl.innerHTML=`<div class="banner" style="border-color:#c99;background:#f7e5e2">${esc(e.message)}</div>`;}
}
async function logout(){await fetch("/api/logout",{method:"POST"});renderSalon()}
async function createLink(){let service=newService.value,clientName=newClient.value,r=await fetch("/api/salon/links",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service,clientName})}),d=await r.json();if(!r.ok)return alert(d.error||"Could not create link");let link=location.origin+location.pathname+"?token="+encodeURIComponent(d.token);newLink.innerHTML=`<div class="banner"><b>Private client link</b><div class="linkbox">${esc(link)}</div><button class="btn copy" style="margin-top:8px" onclick="navigator.clipboard.writeText('${link}')">Copy link</button></div>`}
async function loadInbox(){let r=await fetch("/api/salon/submissions"),d=await r.json();if(!r.ok)return;inbox.innerHTML=d.submissions.length?d.submissions.map(x=>`<div class="row"><div><b>${esc(x.client.fullName)}</b><br><small>${esc(x.service)} · ${new Date(x.submittedAt).toLocaleString()}</small></div><button class="btn" onclick='viewSubmission("${x.id}")'>Review</button></div>`).join(""):"<p class='muted'>No consultations submitted yet.</p>"}
async function viewSubmission(id){let d=await fetch("/api/salon/submissions").then(r=>r.json()),x=d.submissions.find(a=>a.id===id);if(!x)return;salon.innerHTML=`<div class="card"><button class="btn" onclick="renderSalon()">← Inbox</button><div class="eyebrow" style="margin-top:18px">${esc(x.service)}</div><h1>${esc(x.client.fullName)}</h1><p class="muted">Submitted ${new Date(x.submittedAt).toLocaleString()}</p>${Object.entries(x.answers).map(([k,v])=>`<div class="row"><div><b>${esc(k.replace(/([A-Z])/g," $1"))}</b><br><small>${esc(Array.isArray(v)?v.join(", "):v||"Not provided")}</small></div></div>`).join("")}<div class="no-print" style="margin-top:14px"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div></div>`}
if(client.token)loadClient();else renderClient();
</script></body></html>
