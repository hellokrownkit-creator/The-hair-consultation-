
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d584a">
<title>THE HAIR CONSULTATION™</title>
<style>
:root{--ink:#2b2622;--muted:#756d66;--paper:#fffdf9;--bg:#f3efe9;--line:#ded5cc;--accent:#6d584a;--soft:#eee7df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.brand{font:500 25px Georgia,serif;letter-spacing:.08em}.brand small{display:block;font:10px system-ui,sans-serif;letter-spacing:.18em;color:var(--muted);margin-top:5px}
.tabs{display:flex;gap:10px;margin-bottom:22px}.tab,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none!important}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 4px 18px rgba(43,38,34,.04)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.muted{color:var(--muted)}
h1{font:500 38px/1.1 Georgia,serif;margin:8px 0 14px}h2{font:500 25px Georgia,serif;margin:4px 0 14px}h3{margin:0 0 8px}
.field{margin:14px 0}.field label{display:block;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:105px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choices label{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;font-weight:400}.choices input{width:auto;margin-right:6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.bar{height:5px;background:var(--soft);border-radius:10px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:var(--accent);width:0}
.banner{padding:13px 15px;border:1px solid var(--line);background:#f7f2eb;border-radius:10px;margin:12px 0}.error{border-color:#c99;background:#f7e5e2}.success{border-color:#9b8;background:#edf5e8}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.link{word-break:break-all}
@media(max-width:650px){.wrap{padding:20px 14px 45px}header{display:block}.tabs{margin-top:18px}.grid{grid-template-columns:1fr}h1{font-size:32px}.brand{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">THE HAIR CONSULTATION™<small>PRIVATE PRE-APPOINTMENT EDITION</small></div></header>
<nav class="tabs" aria-label="Portal">
<button id="tClient" class="tab active" type="button">Client</button>
<button id="tSalon" class="tab" type="button">Salon</button>
</nav>
<section id="client"></section>
<section id="salon" class="hidden"></section>
</div>
<script>
'use strict';

const SERVICES=['Haircut / Styling','Colour / Lightening','Treatment / Repair','Texture / Smoothing'];
const STEPS=['details','goals','history','condition','scalp','notes','review'];
const client={step:0,fields:{},token:new URLSearchParams(location.search).get('token')||localStorage.getItem('hairConsultationToken')||''};
let salon={signedIn:false,salonName:'',links:[],submissions:[]};

const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function setActive(mode){
  const clientMode=mode==='client';
  $('client').classList.toggle('hidden',!clientMode);
  $('salon').classList.toggle('hidden',clientMode);
  $('tClient').classList.toggle('active',clientMode);
  $('tSalon').classList.toggle('active',!clientMode);
  window.scrollTo({top:0,behavior:'smooth'});
}

$('tClient').addEventListener('click',()=>setActive('client'));
$('tSalon').addEventListener('click',()=>{setActive('salon');renderSalon();});

function choices(name,items,selected){
  return '<div class="choices">'+items.map(item=>{
    const id=name+'-'+item.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    return '<label for="'+esc(id)+'"><input id="'+esc(id)+'" type="radio" name="'+esc(name)+'" value="'+esc(item)+'" '+(selected===item?'checked':'')+'> '+esc(item)+'</label>';
  }).join('')+'</div>';
}

function area(name,label,value,placeholder){
  return '<div class="field"><label for="'+esc(name)+'">'+esc(label)+'</label><textarea id="'+esc(name)+'" name="'+esc(name)+'" placeholder="'+esc(placeholder||'')+'">'+esc(value||'')+'</textarea></div>';
}

function input(name,label,value,type='text'){
  return '<div class="field"><label for="'+esc(name)+'">'+esc(label)+'</label><input id="'+esc(name)+'" name="'+esc(name)+'" type="'+type+'" value="'+esc(value||'')+'"></div>';
}

function collectClient(){
  document.querySelectorAll('#client [name]').forEach(el=>{
    if(el.type==='radio'){if(el.checked) client.fields[el.name]=el.value;}
    else if(el.type==='checkbox'){client.fields[el.name]=el.checked;}
    else client.fields[el.name]=el.value;
  });
}

function renderClient(){
  if(!client.token){
    $('client').innerHTML='<div class="card"><div class="eyebrow">Client link</div><h1>Your consultation link is missing.</h1><p class="muted">Please use the private consultation link sent by your salon.</p></div>';
    return;
  }
  const step=STEPS[client.step]||'details';
  let content='';
  if(step==='details'){
    content='<div class="card"><div class="eyebrow">Before your appointment</div><h2>Help your stylist understand your hair before you arrive.</h2>'+input('fullName','Full name',client.fields.fullName)+ '<div class="field"><label for="service">Service</label><select id="service" name="service"><option value="">Choose a service</option>'+SERVICES.map(s=>'<option value="'+esc(s)+'" '+(client.fields.service===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div></div>';
  }else if(step==='goals'){
    content='<div class="card"><div class="eyebrow">Your desired result</div><h2>What would you like to achieve?</h2>'+area('desiredResult','Desired result',client.fields.desiredResult,'Tell your stylist what you want from this appointment.')+area('inspiration','Inspiration','', 'What do you love about your inspiration?')+area('avoid','Anything you definitely want to avoid?',client.fields.avoid,'Tell us what you do not want.')+'</div>';
  }else if(step==='history'){
    content='<div class="card"><div class="eyebrow">Hair & chemical history</div><h2>Please include anything that could affect your service.</h2>'+area('chemicalHistory','Chemical history',client.fields.chemicalHistory,'Colour, bleach, relaxers, keratin, extensions, etc.')+area('references','Reference / previous service',client.fields.references,'Recent salon services or important history.')+'</div>';
  }else if(step==='condition'){
    content='<div class="card"><div class="eyebrow">Your hair today</div><h2>Hair pattern</h2><div class="field">'+choices('pattern',['Straight','Wavy','Curly','Coily'],client.fields.pattern)+'</div><div class="field"><label>Hair thickness</label>'+choices('thickness',['Fine','Medium','Thick'],client.fields.thickness)+'</div></div>';
  }else if(step==='scalp'){
    content='<div class="card"><div class="eyebrow">Scalp & sensitivity</div><h2>Have you experienced any of these?</h2><div class="field">'+choices('scalp',['Itching','Flaking','Redness','Irritation','Previous scalp reaction','None'],client.fields.scalp)+'</div><div class="field"><label>Current concerns</label>'+choices('concerns',['Dryness','Oiliness','Breakage','Sensitivity','None'],client.fields.concerns)+'</div></div>';
  }else if(step==='notes'){
    content='<div class="card"><div class="eyebrow">Anything else?</div><h2>Anything you would like your stylist to know?</h2>'+area('additionalNotes','Additional notes',client.fields.additionalNotes,'Anything else that may help your stylist prepare.')+'</div>';
  }else{
    content='<div class="card"><div class="eyebrow">Review & submit</div><h2>Check your answers.</h2><div class="banner">Your salon will receive this consultation after you submit it.</div><div id="reviewList"></div><label class="field"><input id="confirm" type="checkbox"> I confirm that the information above is accurate.</label></div>';
  }
  $('client').innerHTML=content+'<div class="bar"><i style="width:'+((client.step+1)/STEPS.length*100)+'%"></i></div><div class="nav">'+(client.step>0?'<button id="back" class="btn" type="button">Back</button>':'<span></span>')+(step==='review'?'<button id="submit" class="btn primary" type="button">Submit consultation</button>':'<button id="next" class="btn primary" type="button">Next</button>')+'</div>';
  if(step==='review') buildReview();
  const next=$('next'); const back=$('back'); const submit=$('submit');
  if(next) next.addEventListener('click',()=>{collectClient();if(validateStep())return;client.step++;renderClient();});
  if(back) back.addEventListener('click',()=>{collectClient();client.step--;renderClient();});
  if(submit) submit.addEventListener('click',submitClient);
}

function validateStep(){
  if(STEPS[client.step]==='details' && (!client.fields.fullName||!client.fields.service)){alert('Please provide your name and choose your service.');return true;}
  return false;
}

function buildReview(){
  const f=client.fields;
  const rows=[['Name',f.fullName],['Service',f.service],['Desired result',f.desiredResult],['Chemical history',f.chemicalHistory],['Hair pattern',f.pattern],['Hair thickness',f.thickness],['Scalp',f.scalp],['Current concerns',f.concerns],['Additional notes',f.additionalNotes]];
  $('reviewList').innerHTML=rows.map(r=>'<div class="row"><strong>'+esc(r[0])+'</strong><span>'+esc(r[1]||'None provided')+'</span></div>').join('');
}

async function submitClient(){
  collectClient();
  if(!$('confirm').checked){alert('Please confirm your information before submitting.');return;}
  const button=$('submit');button.disabled=true;button.textContent='Submitting…';
  try{
    const response=await fetch('/api/client/submit?token='+encodeURIComponent(client.token),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(client.fields)});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'Could not submit consultation.');
    $('client').innerHTML='<div class="card"><div class="eyebrow">Submitted</div><h1>Consultation received.</h1><p class="muted">Your salon has received your pre-appointment information.</p></div>';
  }catch(error){button.disabled=false;button.textContent='Submit consultation';showError($('client'),error.message);}
}

async function loadClient(){
  try{
    const response=await fetch('/api/client/link?token='+encodeURIComponent(client.token),{credentials:'same-origin'});
    const data=await response.json().catch(()=>({}));
    if(response.ok && data){client.fields={...(data.fields||{}),fullName:data.fullName||data.clientName||data.fields?.fullName||'',service:data.service||data.fields?.service||''};}
  }catch(e){}
  renderClient();
}

function showError(container,message){
  const b=document.createElement('div');b.className='banner error';b.textContent=message||'Unknown error';container.prepend(b);
}

function renderSalon(){
  $('salon').innerHTML='<div class="card"><div class="eyebrow">Salon portal</div><h1>Loading…</h1><p class="muted">Checking salon access.</p></div>';
  loadSalon();
}

async function loadSalon(){
  try{
    const response=await fetch('/api/me',{credentials:'same-origin'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||('Server returned '+response.status));
    if(!data.signedIn){renderLogin();return;}
    salon.signedIn=true;salon.salonName=data.salonName||data.name||'';await loadSalonData();renderDashboard();
  }catch(error){
    $('salon').innerHTML='<div class="card"><div class="eyebrow">Salon portal</div><h2>Salon area could not load.</h2><div class="banner error">'+esc(error.message)+'</div><p class="muted">The page is working, but the salon API did not respond successfully.</p></div>';
  }
}

function renderLogin(){
  $('salon').innerHTML='<div class="card"><div class="eyebrow">Salon portal</div><h1>Private consultation inbox</h1><p class="muted">Sign in to create client links and review submitted consultations.</p>'+input('pw','Salon password','','password')+'<button id="login" class="btn primary" type="button">Sign in</button><div id="loginError"></div></div>';
  $('login').addEventListener('click',login);
}

async function login(){
  const button=$('login'),password=$('pw').value,error=$('loginError');
  button.disabled=true;error.innerHTML='';
  try{
    const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||'Sign in failed.');
    salon.signedIn=true;salon.salonName=data.salonName||data.name||'';await loadSalonData();renderDashboard();
  }catch(e){error.innerHTML='<div class="banner error">'+esc(e.message)+'</div>';button.disabled=false;}
}

async function loadSalonData(){
  const [linksResponse,submissionsResponse]=await Promise.all([fetch('/api/salon/links',{credentials:'same-origin'}),fetch('/api/salon/submissions',{credentials:'same-origin'})]);
  if(linksResponse.ok){const d=await linksResponse.json();salon.links=Array.isArray(d)?d:(d.links||[]);}
  if(submissionsResponse.ok){const d=await submissionsResponse.json();salon.submissions=Array.isArray(d)?d:(d.submissions||[]);}
}

function renderDashboard(){
  $('salon').innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div class="eyebrow">Salon portal</div><h2>Consultation Inbox</h2></div><button id="logout" class="btn" type="button">Sign out</button></div><p class="muted">Create a private consultation link for each client.</p><div class="grid"><div class="field"><label for="newClient">Client name</label><input id="newClient" type="text" placeholder="Client name"></div><div class="field"><label for="newService">Service</label><select id="newService"><option value="">Choose a service</option>'+SERVICES.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')+'</select></div></div><button id="createLink" class="btn primary" type="button">Create private link</button><div id="linkResult"></div></div><div class="card"><div class="eyebrow">Client links</div><div id="linksList"></div></div><div class="card"><div class="eyebrow">Submitted consultations</div><div id="submissionsList"></div></div>';
  $('logout').addEventListener('click',logout);$('createLink').addEventListener('click',createLink);renderLinks();renderSubmissions();
}

function renderLinks(){
  $('linksList').innerHTML=salon.links.length?salon.links.map(x=>'<div class="row"><div><strong>'+esc(x.clientName||x.name||'Client')+'</strong><div class="muted">'+esc(x.service||'')+'</div></div><div class="link">'+esc(x.url||x.link||(location.origin+'/?token='))+'</div></div>').join(''):'<p class="muted">No client links yet.</p>';
}

function renderSubmissions(){
  $('submissionsList').innerHTML=salon.submissions.length?salon.submissions.map(x=>'<div class="row"><div><strong>'+esc(x.fullName||x.clientName||'Client')+'</strong><div class="muted">'+esc(x.service||'')+'</div></div><div class="muted">'+esc(x.submittedAt||x.createdAt||'Submitted')+'</div></div>').join(''):'<p class="muted">No submitted consultations yet.</p>';
}

async function createLink(){
  const clientName=$('newClient').value.trim(),service=$('newService').value,button=$('createLink'),result=$('linkResult');
  result.innerHTML='';if(!clientName||!service){showError(result,'Please provide a client name and service.');return;}
  button.disabled=true;button.textContent='Creating…';
  try{
    const response=await fetch('/api/salon/links',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({service,clientName})});
    const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Could not create consultation link.');
    const link=data.url||data.link||data.consultationUrl||((location.origin)+'/?token='+encodeURIComponent(data.token||''));
    result.innerHTML='<div class="banner success"><strong>Private consultation link created.</strong><div class="link">'+esc(link)+'</div></div>';
    await loadSalonData();renderLinks();
    $('newClient').value='';$('newService').value='';
  }catch(e){showError(result,e.message);}finally{button.disabled=false;button.textContent='Create private link';}
}

async function logout(){
  try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'});}catch(e){}
  salon={signedIn:false,salonName:'',links:[],submissions:[]};renderLogin();
}

if(client.token){localStorage.setItem('hairConsultationToken',client.token);loadClient();}else{renderClient();}
</script>
</body>
 </html>
